<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0066FF">
    <title>Hors ligne — IVOSPHERE</title>
    <link rel="icon" type="image/png" href="/icons/icon-192.png">
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px 16px; background: #F6F9FC; color: #0A2540;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        main { width: 100%; max-width: 380px; text-align: center; }
        img { width: 96px; height: 96px; border-radius: 20px; }
        h1 { margin: 20px 0 8px; font-size: 20px; }
        p { margin: 0 0 24px; color: #425466; font-size: 15px; line-height: 1.5; }
        button {
            border: 0; border-radius: 12px; padding: 12px 20px; width: 100%;
            background: #0066FF; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer;
        }
        button:hover { background: #0052CC; }
        @media (prefers-color-scheme: dark) {
            body { background: #0B0F14; color: #E6EAF0; }
            p { color: #94A3B8; }
        }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="IVOSPHERE">
        <h1>Vous êtes hors ligne</h1>
        <p>Impossible de joindre IVOSPHERE pour le moment. Vérifiez votre connexion internet puis réessayez.</p>
        <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
    <script>
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
